# 价格表种子数据（M3 计费）
# 结构对应 docs/m3-billing-plan.md §3：provider × model × token_class，金额单位 micro-USD。
# 只收录厂商官网或上游文档里明确写出的美元价；没有公开美元价的模型放入 unpriced，不估算。
#
# 约定：
# 1. provider 统一写 "*"：当前上游（muse / gptgrok / opencode / codebuddy / zcode / trae 等）
#    都是转售或逆向网关，不公开自己的结算价；这里记录的是模型厂商官网标价，
#    作为 M3 定价基准，不声称等于上游结算价。M3 解析时 "*" 是通配行（见方案 §3.1）。
# 2. price_per_mtok 用字符串保留原始小数位；price_micro_per_1m = price_per_mtok × 1_000_000（整数）。
# 3. effective_from 是"本仓首次确认该价格的抓取时间"，不是厂商公告的调价时间；
#    首版种子行统一为 2026-11-02 00:00:00 +08:00，后续补价行用各自首次确认日。
# 4. reasoning 不单独建行：方案 §2.1 规定缺省回落到 output 价。
# 5. 上下文分档 / 峰谷价 / 缓存写入 TTL 无法用单行表达，取基准档并在 note 注明差异。

version: 1
currency: USD
unit: per_1m_tokens
captured_at: "2026-11-04"
default_effective_from: 1793548800

