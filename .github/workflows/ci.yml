name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一 ref 的新提交取消旧 run，避免过期门禁结果误导
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/control/requirements*.txt

      - name: Install backend deps
        working-directory: apps/control
        run: python -m pip install -r requirements-dev.txt

      # 依赖装好再 import：check_indexes 会 import app.db，避免引入第三方依赖后
      # 在未安装环境里 exit 2（报错只有一句 ImportError，难定位）
      - name: 索引存在性检查
        run: python scripts/check_indexes.py

      - name: 契约检查（仅拦幽灵端点）
        working-directory: apps/control
        run: python ../../scripts/contract_check.py --fail-on-ghost

      # conftest 里假上游/控制面起不来是无条件 pytest.skip：整批跳过照样 exit 0，tee 留日志给下一道门查
      - name: Pytest
        working-directory: apps/control
        run: |
          set -euo pipefail
          python -m pytest tests/ -v -rs | tee pytest.log

      # 不能整条禁 skip：test_hardening.py::test_db_file_is_owner_only 是 [env] 环境性跳过
      # （Windows 无 POSIX 权限位，Linux 上真跑）。门禁改由脚本精确判定：
      # 每条 SKIPPED 原因必须带 [env]，条数必须等于本平台声明数（Linux=0 / Windows=1）。
      - name: 零 skip 门（只放行 [env] 环境性跳过，条数精确）
        working-directory: apps/control
        run: |
          set -euo pipefail
          python ../../scripts/check_no_bad_skip.py --selftest
          python ../../scripts/check_no_bad_skip.py pytest.log

      - name: Compile-check
        working-directory: apps/control
        run: python -m compileall app tests

      # 关键表清单不写死，直接读 backup_core.REQUIRED_TABLES，避免两处定义漂移
      - name: 备份恢复演练（backup → restore → Python 复查）
        run: |
          set -euo pipefail
          DRILL="$(mktemp -d)"
          python - "$DRILL" <<'PY'
          import sqlite3
          import sys
          import time
          from pathlib import Path

          sys.path.insert(0, "apps/control")
          from app.db import Database

          drill = Path(sys.argv[1])
          source = drill / "source.db"
          Database(source)
          conn = sqlite3.connect(source)
          conn.execute(
              "INSERT INTO users(username, password_hash, role, created_at) VALUES(?, ?, 'admin', ?)",
              ("ci_drill_admin", "not-a-real-hash", int(time.time())),
          )
          conn.commit()
          conn.close()
          # 恢复目标先建成无 admin 的空库：恢复后 admin 在 = 内容确实被替换
          Database(drill / "target.db")
          print(f"drill: {drill}")
          PY
          python scripts/backup_core.py backup --db "$DRILL/source.db" --out-dir "$DRILL/backups"
          ARCHIVE="$(python scripts/backup_core.py latest --out-dir "$DRILL/backups")"
          python scripts/backup_core.py restore --archive "$ARCHIVE" --db "$DRILL/target.db" --backups "$DRILL/pre-restore"
          TARGET="$DRILL/target.db"
          python - "$TARGET" <<'PY'
          import sqlite3
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          import backup_core

          target = Path(sys.argv[1])
          conn = sqlite3.connect(f"file:{target}?mode=ro", uri=True)
          try:
              integrity = conn.execute("PRAGMA integrity_check").fetchone()[0]
              if integrity != "ok":
                  print(f"::error::备份恢复门失败：恢复库 integrity_check={integrity}")
                  raise SystemExit(1)
              existing = {
                  row[0]
                  for row in conn.execute("SELECT name FROM sqlite_master WHERE type='table'")
              }
              missing = [t for t in backup_core.REQUIRED_TABLES if t not in existing]
              if missing:
                  print(f"::error::备份恢复门失败：恢复库缺表 {', '.join(missing)}")
                  raise SystemExit(1)
              admins = conn.execute(
                  "SELECT COUNT(*) FROM users WHERE role='admin'"
              ).fetchone()[0]
              if admins < 1:
                  print("::error::备份恢复门失败：恢复库无 admin（内容未被替换？）")
                  raise SystemExit(1)
          finally:
              conn.close()
          print(
              f"备份恢复演练通过：{len(backup_core.REQUIRED_TABLES)} 张关键表均存在，admin={admins}"
          )
          PY

      # CLI 演练只覆盖 scripts/backup_core.py；这一道补 API 的四个关口
      # （admin-only / 缺 confirm / 文件名穿越 / 归档校验）+ 正常 backup→restore 往返。
      # 脚本自起临时控制面、随机端口、不连任何外部服务，退出前确认端口无残留监听。
      - name: 备份恢复 API 演练（API 层四道关 + 正常往返）
        run: python scripts/backup_api_smoke.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: i18n 键集校验
        run: python scripts/check_i18n.py --strict

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend deps
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      # ESLint 只在 error 时非 0，warning 本身就是 exit 0，原 `|| echo` 会连 error 一起放行
      - name: Lint (warn-only)
        working-directory: apps/web
        run: npm run lint

      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Build export
        working-directory: apps/web
        run: npm run build:export

      # 仓库 .npmrc 指向 npmmirror，它没有 audit 端点，必须显式指回官方 registry
      - name: npm audit 阻断门（high/critical 即失败）
        working-directory: apps/web
        run: |
          if ! npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org; then
            echo "::error::npm audit 门失败：存在 high/critical 漏洞"
            exit 1
          fi
          echo "npm audit 门通过：0 critical / 0 high"

  # 只在 PR 与手动触发跑，不挂 push main 的高频路径
  upstream-check:
    name: upstream-check (drift informational / error fails)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 上游巡检（updated 仅提示，error 才拦）
        continue-on-error: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::notice::未带令牌，跳过上游巡检（fork PR 等 secret 不可用场景）"
            exit 0
          fi
          code=0
          output=$(python scripts/check_upstreams.py) || code=$?
          printf '%s\n' "$output"
          if [ "$code" -eq 1 ]; then
            n=$(printf '%s\n' "$output" | sed -n 's/.*，updated \([0-9][0-9]*\)，.*/\1/p')
            echo "::notice::有 ${n:-未知} 家上游出现新 commit，已记录但未推进基线；协议面影响需人工判定，见 docs/UPSTREAM-SYNC.md"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            echo "::error::上游巡检有仓 error/不可达（exit=$code），见上方输出"
          fi
          exit "$code"
