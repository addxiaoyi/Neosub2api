# 生产入口：浏览器 → 本容器(80/443) → web:80（静态导出）/ control:8000（/api、/v1、/healthz）
# 本文件挂载为 /etc/nginx/conf.d/default.conf，属于 http 上下文，只写 http 内指令。

upstream control_plane {
  server control:8000;
  keepalive 32;          # 复用长连接，避免每个请求都重新握手
}

upstream web_static {
  server web:80;
  keepalive 16;
}

