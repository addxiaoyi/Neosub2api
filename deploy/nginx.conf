#   超过就把下面两组 map 各复制一段加深（每段一次正则替换，实测成本见 deploy/README.md）。
# 敏感参数名：api_key / apikey / api-key / x-api-key / access_key / access_token / refresh_token /
#             refresh / client_secret / private_key / key_id / key / token / jwt / authorization /
#             auth / secret / password / passwd / session / sig / signature
# 敏感值：任何以 u2a_ 开头的查询参数值或裸参数（不管参数名是什么），含 %75%32%61_ 编码形态
