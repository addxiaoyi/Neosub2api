# Referer 里同样可能带 query（例如前端把密钥拼进跳转链接），只保留 origin+path，query 整体丢掉
map $http_referer $log_referer {
  default  "-";
  "~^([^?]*)"  $1;
}

# 错误日志不受 log_format 控制：upstream 连接失败等 error 级记录会把原始 request line（含 query）
# 原样打出来。这里只保留 crit 及以上，避免 api_key / u2a_ 进 error.log；
# 排障时临时改成 error 或 warn，排完必须改回，且排障期间不要用带密钥的 URL 打请求。
error_log /var/log/nginx/error.log crit;

log_format u2a_redacted '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $log_uri_40 $server_protocol" '
                        '$status $body_bytes_sent "$log_referer" "$http_user_agent"';

# 80：只放行 ACME 挑战与内部健康检查，其余整站跳 HTTPS
server {
  listen 80;
  server_name _;

  # 脱敏后的访问日志：查询串里的密钥/令牌统一落成 ***，见文件顶部的 map 链
  access_log /var/log/nginx/access.log u2a_redacted;

  # 续期时 certbot 必须能走明文 80 拿到 token，所以不能把这里也跳转掉
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # 容器 healthcheck 走明文：证书过期时仍能判断进程与反代是否活着
  location = /healthz {
    proxy_pass http://control_plane;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;          # 关掉 TLS1.0/1.1，主流客户端均支持 1.2+
  ssl_session_cache shared:TLS:10m;
  ssl_session_timeout 1d;

  server_tokens off;                       # 不在错误页暴露 nginx 版本

  # 脱敏后的访问日志：查询串里的密钥/令牌统一落成 ***，见文件顶部的 map 链
  access_log /var/log/nginx/access.log u2a_redacted;

  # HSTS：证书稳定后再启用；用自签名证书调试时先删掉这一行，否则浏览器会记住并要求 HTTPS
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # 阻止浏览器把 JSON/文本嗅探成 HTML 或脚本执行
  add_header X-Content-Type-Options "nosniff" always;
  # 跨站跳转只带 origin，避免完整 URL（含路径里的密钥）泄露给第三方
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # 管理后台不允许被第三方页面 iframe 嵌入
  add_header X-Frame-Options "SAMEORIGIN" always;

  # 网关请求可能带 base64 图片；32m 覆盖常见多图请求，超出直接 413，避免打满内存
  client_max_body_size 32m;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;                        # 反代来的响应也要压，否则前端 chunk 全是原始体积
  # 已压缩的格式（png/jpeg/woff2）不再二次压缩，避免白耗 CPU
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

  # 健康检查不进 access 日志，避免探活把日志刷满
  location = /healthz {
    access_log off;
    proxy_pass http://control_plane;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 管理面 JSON 接口：普通缓冲即可
  location /api/ {
    proxy_pass http://control_plane;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # 管理接口靠会话 Cookie；Authorization 也显式透传，供 Bearer 方式调用
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;               # 批量同步/检查类接口可能跑几十秒
  }

  # 网关流式接口：SSE 必须逐块下发，任何缓冲/压缩都会让它"卡住后一次性吐出"
  location /v1/ {
    proxy_pass http://control_plane;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # 网关鉴权依赖 Bearer；显式透传，防止模板里的 proxy_set_header Authorization "" 把它剥掉
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;                   # 关键：不缓冲上游响应
    proxy_cache off;
    gzip off;                              # 关键：压缩同样会攒包，流式必须关
    proxy_request_buffering off;           # 大请求体边收边转发，降低首包延迟

    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;               # 上游生成慢时不能被默认 60s 掐断
    proxy_send_timeout 300s;
  }

  # Next 静态导出：/_next/static 下文件名带内容 hash，可放心长缓存
  location /_next/static/ {
    proxy_pass http://web_static;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    expires 1y;                            # 发版后旧 chunk 仍可命中，避免用户加载失败
  }

  # 其余路径全部是 HTML（含 SPA 回退到的 index.html）：不缓存，保证发版立即生效
  location / {
    proxy_pass http://web_static;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    expires -1;                            # 输出 Cache-Control: no-cache
  }
}
