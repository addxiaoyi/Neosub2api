# 一键起（本机自托管）：control（FastAPI）+ web（apps/web 静态导出，nginx 托管）。
# 启动：docker compose up -d --build
# 变量：仓库根 .env（compose 自动读取做 ${VAR} 插值），模板见根 .env.example。
# 需要 TLS / 域名 / 访问日志脱敏时改用 deploy/docker-compose.prod.yml，不要直接把它暴露到公网。
name: unified-2api

services:
  control:
    build:
      # context 是仓库根：Dockerfile 要按仓库布局放 app/，还要拷 config/ 与 CHANGELOG.md
      context: .
      dockerfile: apps/control/Dockerfile
    environment:
      # 容器内固定路径，覆盖根 .env 里给本机脚本用的相对路径
      UNIFIED_DATA_DIR: /data
      UNIFIED_DB_PATH: /data/unified.db
      UNIFIED_HOST: 0.0.0.0
      UNIFIED_PORT: 8000
      UNIFIED_ADMIN_USER: ${UNIFIED_ADMIN_USER:-admin}
      # 不提供默认口令：留空则容器首次启动随机生成，写到 /data/admin-password.txt 并打印在日志里
      UNIFIED_ADMIN_PASSWORD: ${UNIFIED_ADMIN_PASSWORD:-}
      UNIFIED_SESSION_TTL_SEC: ${UNIFIED_SESSION_TTL_SEC:-86400}
      # 根编排没有 TLS；需要 HTTPS 时改用 deploy/docker-compose.prod.yml 并把这里置 true
      UNIFIED_COOKIE_SECURE: ${UNIFIED_COOKIE_SECURE:-false}
      UNIFIED_CORS_ORIGINS: ${UNIFIED_CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      UNIFIED_ALLOW_PRIVATE_UPSTREAMS: ${UNIFIED_ALLOW_PRIVATE_UPSTREAMS:-0}
      UNIFIED_SSE_MAX_SECONDS: ${UNIFIED_SSE_MAX_SECONDS:-600}
      UNIFIED_ALLOW_ANONYMOUS_GATEWAY: ${UNIFIED_ALLOW_ANONYMOUS_GATEWAY:-false}
      UNIFIED_FAILURE_WINDOW_SEC: ${UNIFIED_FAILURE_WINDOW_SEC:-60}
      UNIFIED_FAILURE_WINDOW_MAX: ${UNIFIED_FAILURE_WINDOW_MAX:-20}
      UNIFIED_MODELS_CACHE_TTL_SEC: ${UNIFIED_MODELS_CACHE_TTL_SEC:-60}
      UNIFIED_MODEL_FALLBACK_FIRST: ${UNIFIED_MODEL_FALLBACK_FIRST:-0}
      # 日志与上游连接池：与其余键同走根 .env 插值；不加 env_file，避免缺 .env 时的文件依赖
      UNIFIED_LOG_LEVEL: ${UNIFIED_LOG_LEVEL:-info}
      UNIFIED_LOG_FORMAT: ${UNIFIED_LOG_FORMAT:-text}
      UNIFIED_ENABLE_DOCS: ${UNIFIED_ENABLE_DOCS:-0}
      UNIFIED_UPSTREAM_MAX_CONNECTIONS: ${UNIFIED_UPSTREAM_MAX_CONNECTIONS:-100}
      UNIFIED_UPSTREAM_MAX_KEEPALIVE: ${UNIFIED_UPSTREAM_MAX_KEEPALIVE:-50}
      # 演示模式只在本机用 scripts/demo.*；容器编排强制关闭，避免反代把来源地址变成 127.0.0.1 后绕过请求级 403
      UNIFIED_DEMO_MODE: "0"
      # sidecar 跑在宿主机上（非 compose 服务），容器内必须用 host.docker.internal
      CODEBUDDY_BASE: ${CODEBUDDY_BASE:-http://host.docker.internal:7864}
      CODEBUDDY_API_KEY: ${CODEBUDDY_API_KEY:-}
      OPENCODE_UPSTREAM_BASE: ${OPENCODE_UPSTREAM_BASE:-https://opencode.ai/zen}
      # 注册任务执行器：留空则任务明确失败，不伪造成功
      GROK_REGISTER_EXECUTOR_URL: ${GROK_REGISTER_EXECUTOR_URL:-}
      GROK_REGISTER_MAX_CONCURRENCY: ${GROK_REGISTER_MAX_CONCURRENCY:-2}
      GROK_REGISTER_MAX_WORKERS: ${GROK_REGISTER_MAX_WORKERS:-4}
      GROK_REGISTER_EXECUTOR_TIMEOUT_SEC: ${GROK_REGISTER_EXECUTOR_TIMEOUT_SEC:-900}
      GROK_REGISTER_POLL_INTERVAL_SEC: ${GROK_REGISTER_POLL_INTERVAL_SEC:-2}
      TRAE_SIDECAR_BASE: ${TRAE_SIDECAR_BASE:-http://host.docker.internal:7871}
      # Deepseek2Go 上游默认端口 5001；若自行改 sidecar 端口需同步
      DEEPSEEK_SIDECAR_BASE: ${DEEPSEEK_SIDECAR_BASE:-http://host.docker.internal:5001}
      QODER_SIDECAR_BASE: ${QODER_SIDECAR_BASE:-http://host.docker.internal:7873}
      # codar2api（MIT）默认关闭：需自行 clone 上游并在宿主机启动
      CODAR_SIDECAR_BASE: ${CODAR_SIDECAR_BASE:-http://host.docker.internal:8801}
      # 在线更新：默认关闭。开启后容器内执行「下载→验签→换目录→退出进程」，
      # 由 restart: unless-stopped 用绑挂进来的新代码重新拉起（见下方 volumes）
      UNIFIED_UPDATE_ENABLED: ${UNIFIED_UPDATE_ENABLED:-false}
      UNIFIED_UPDATE_MANIFEST_URL: ${UNIFIED_UPDATE_MANIFEST_URL:-}
      UNIFIED_UPDATE_PUBKEY: ${UNIFIED_UPDATE_PUBKEY:-deploy/release-pubkey.pem}
    volumes:
      # SQLite 与 admin-password.txt 都落在仓库根 data/，删容器不丢数据
      - ./data:/data
      # 在线更新必须绑挂代码目录：镜像层里的代码一重建就回退，绑挂后换目录才真的生效。
      # 挂 apps/control 而不是 apps/control/app：目录交换用 rename，挂载根不能被 rename。
      - ./apps/control:/repo/apps/control
      # 静态产物：更新器写这里，web 的 nginx 也挂同一份宿主机目录
      - ./apps/web/out:/repo/apps/web/out
      - ./scripts:/repo/scripts
      # 验签公钥（只读）：更新包必须用仓库内固定的公钥验，不能由 manifest 自带
      - ./deploy:/repo/deploy:ro
      # 单文件绑挂点不能 rename，更新时按「留副本 + 原地写」处理
      - ./CHANGELOG.md:/repo/CHANGELOG.md
    ports:
      # 默认只映射到本机；需要局域网/公网访问时显式 UNIFIED_BIND_HOST=0.0.0.0 并前置 TLS
      - "${UNIFIED_BIND_HOST:-127.0.0.1}:8010:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux 下也能访问宿主机 sidecar
    restart: unless-stopped
    stop_grace_period: 30s         # 给 SQLite WAL 收尾时间
    healthcheck:
      # 控制面真实探针：GET /healthz（apps/control/app/main.py 已注册）
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).getcode()==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./apps/web
    depends_on:
      control:
        condition: service_healthy
    ports:
      # 只绑本机：这个入口会同时反代 /api、/v1，别在未加 TLS 时暴露到局域网
      - "${UNIFIED_BIND_HOST:-127.0.0.1}:8080:80"
    volumes:
      # 静态产物绑挂：在线更新只覆盖 apps/web/out，nginx 直接读宿主机目录，不重建镜像。
      # 因为挂载点不能被 rename，执行器对这一项走原地覆盖而不是目录交换。
      # 前提：宿主机上 apps/web/out 已存在（apps/web 下 npm run build:export 生成）；
      # 目录不存在时 docker 会建空目录，表现为 403/白屏，健康检查会报 unhealthy。
      - ./apps/web/out:/usr/share/nginx/html:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
