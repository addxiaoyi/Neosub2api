# 上游仓库追踪清单
#
# 用途：记录本仓（unified-2api）所参考 / 代理 / 重写的 11 个上游仓库，
# 以及我们实际分析过的 commit。由 scripts/check-upstreams.ps1 读取并比对远端 HEAD。
#
# 格式约定（重要）：
#   - 顶层固定为 version / updated_at / upstreams 三个键。
#   - upstreams 为列表，每个元素必须以 2 个空格的 "- repo: owner/name" 开头。
#   - 元素内部字段统一 4 空格缩进。
#   - our_files 与 protocols 使用 flow 数组（单行 [ "a", "b" ]），
#     不要改写成多行 block 数组，否则 PowerShell 侧解析会失败。
#   - license 值取自上游 LICENSE 文件的实际标题，不做整理。
#   - analyzed_commit 只写 `git rev-parse HEAD` 的真实输出；拿不到就写 unknown。
#   - checked_at 记录最近一次远端巡检日期；巡检只更新它，不自动推进 analyzed_commit。

