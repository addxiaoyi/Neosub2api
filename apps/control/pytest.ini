[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    gateway: /v1/* 网关路由
    keys: 密钥生命周期
    providers: provider 注册表
    usage: usage 旁路
    auth: 鉴权
    security: 安全审计回归（S-01~S-04）
    ux: UX 走查回归（U1~U10）
    smoke: 冒烟（要求控制面与假上游都已就绪）
    system: 系统信息与访问令牌面板
    logs: 请求日志与安全面只读端点
addopts = -ra --strict-markers --tb=short
